<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tama social preview</title>
  <desc id="desc">Tama. Provably secure Ethereum smart contracts.</desc>

  <defs>
    <radialGradient id="paper" cx="0.5" cy="0.12" r="0.92">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.62" stop-color="#f4ead5"/>
      <stop offset="1" stop-color="#e8dbc1"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9442e" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#b9442e" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#0c3a31" stop-opacity="0.38"/>
      <stop offset="0.82" stop-color="#b9442e" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#b9442e" stop-opacity="0"/>
    </linearGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.28 0 0 0 0 0.20 0 0 0 0 0.10 0 0 0 0.12 0"/>
    </filter>
    <filter id="stampPress" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#8a2d1d" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#8a2d1d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" filter="url(#paperGrain)" opacity="0.42"/>

  <g transform="translate(516 72)" filter="url(#stampPress)">
    <rect x="0" y="0" width="168" height="168" rx="10" fill="#b9442e"/>
    <rect x="15" y="15" width="138" height="138" rx="4" fill="none" stroke="#fffaf0" stroke-width="7" opacity="0.76"/>
    <circle cx="40" cy="48" r="3" fill="#fffaf0" opacity="0.13"/>
    <circle cx="122" cy="104" r="4" fill="#11150f" opacity="0.09"/>
    <circle cx="70" cy="133" r="3" fill="#fffaf0" opacity="0.12"/>
    <text x="84" y="118" text-anchor="middle" font-family="Hiragino Mincho ProN, Yu Mincho, Noto Serif CJK JP, serif" font-size="96" font-weight="700" fill="#fffaf0">玉</text>
  </g>

  <text x="600" y="374" text-anchor="middle" font-family="EB Garamond, Georgia, Times New Roman, serif" font-size="156" font-weight="500" fill="#11150f">Tama</text>
  <line x1="366" y1="420" x2="834" y2="420" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="491" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="750" fill="#0c3a31">Provably secure Ethereum smart contracts</text>
</svg>
