name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAMA_LAKE_PACKAGE_CACHE: ${{ github.workspace }}/.cache/tama/lake-packages

jobs:
  rust:
    name: Rust ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msrv
            os: ubuntu-22.04
            toolchain: 1.81.0
          - name: stable-linux
            os: ubuntu-22.04
            toolchain: stable
          - name: stable-macos-arm64
            os: macos-14
            toolchain: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  real-e2e:
    name: Real e2e ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/tama
          key: tama-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/lake-manifest.json') }}
          restore-keys: |
            tama-lake-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/install-toolchain
      - name: Build Tama
        run: cargo build --workspace
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            -o "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.7 "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Fresh starter quickstart
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/debug:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          tmp="$(mktemp -d)"
          project="$tmp/my-protocol"
          tama init "$project"
          cd "$project"
          test -f .github/workflows/ci.yml
          test -f .gitignore
          actionlint -color .github/workflows/ci.yml
          tama doctor
          tama check
          tama build --locked
          tama test
          tama audit
          for field in manifest selectors abi storage-layout yul bytecode runtime-bytecode theorems obligations mirrors trust; do
            tama inspect ERC20Lite "$field" >/dev/null
            tama --json inspect ERC20Lite "$field" | python3 -m json.tool >/dev/null
          done
          printf '%s\n' '# stale lock probe' >> tama.toml
          if tama build --locked; then
            echo "expected tama build --locked to fail after stale tama.toml" >&2
            exit 1
          fi
          tama new TipJar
          tama check
          printf '%s\n' '#check this_is_not_in_scope_for_tama_check' >> verity/proof/TipJarProof.lean
          tama check
          printf '%s\n' '#check this_breaks_tama_check' >> verity/spec/TipJarSpec.lean
          if tama check; then
            echo "expected tama check to fail after breaking a spec module" >&2
            exit 1
          fi
      - name: Counter fixture e2e
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/debug:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          counter="$PWD/fixtures/projects/counter"
          git -C "$counter" init
          tama --root "$counter" update --no-forge
          tama --root "$counter" doctor --fix
          tama --root "$counter" doctor
          tama --root "$counter" check
          tama --root "$counter" --locked build
          tama --root "$counter" test
          tama --root "$counter" audit
          for field in manifest selectors abi storage-layout yul bytecode runtime-bytecode theorems obligations mirrors trust; do
            tama --root "$counter" inspect Counter "$field" >/dev/null
            tama --root "$counter" --json inspect Counter "$field" | python3 -m json.tool >/dev/null
          done

  negative-audit:
    name: Negative audit fixtures
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/tama
          key: tama-lake-negative-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/lake-manifest.json') }}
          restore-keys: |
            tama-lake-negative-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/install-toolchain
      - name: Build Tama and starter baseline
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/debug:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          cargo build --workspace
          tmp="$(mktemp -d)"
          echo "TAMA_NEGATIVE_TMP=$tmp" >> "$GITHUB_ENV"
          tama init "$tmp/base"
          tama --root "$tmp/base" build
          tama --root "$tmp/base" audit
      - name: Mutated audits fail closed
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/debug:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          base="$TAMA_NEGATIVE_TMP/base"

          expect_audit_failure() {
            project="$1"
            check="$2"
            if tama --root "$project" audit "$check"; then
              echo "expected tama audit $check to fail for $project" >&2
              exit 1
            fi
          }

          copy_case() {
            name="$1"
            target="$TAMA_NEGATIVE_TMP/$name"
            cp -R "$base" "$target"
            printf '%s\n' "$target"
          }

          project="$(copy_case deleted-source)"
          rm "$project/verity/src/ERC20Lite.lean"
          expect_audit_failure "$project" structure

          project="$(copy_case corrupted-selector)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["abi"]["functions"][0]["selector"] = "0x00000000"
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" selectors

          project="$(copy_case yul-dispatch-drift)"
          python3 - "$project/artifacts/yul/ERC20Lite.yul" <<'PY'
          import re
          import sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text, count = re.subn(r"case 0x[0-9a-fA-F]{8}", "case 0xffffffff", text, count=1)
          if count != 1:
              raise SystemExit("fixture needs a Yul selector case")
          open(path, "w", encoding="utf-8").write(text)
          PY
          expect_audit_failure "$project" selectors

          project="$(copy_case corrupted-event-topic)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["abi"].setdefault("events", []).append({
              "name": "SyntheticEvent",
              "signature": "SyntheticEvent(address)",
              "topic0": "0x00",
              "fields": [{"name": "account", "type": "address", "indexed": False}],
          })
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" selectors

          project="$(copy_case duplicate-storage)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          if len(data["storage"]) < 2:
              raise SystemExit("fixture needs at least two storage entries")
          data["storage"][1]["slot"] = data["storage"][0]["slot"]
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" storage-layout

          project="$(copy_case layout-report-drift)"
          python3 - "$project/artifacts/layout-report.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["contracts"][0]["fields"][0]["canonicalSlot"] += 1
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" storage-layout

          project="$(copy_case missing-mirror)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["coverage"] = {"disposition": "none", "path": None, "reason": None}
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case mirror-outside-foundry-test)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" "$project/src/ERC20Lite.t.sol" <<'PY'
          import json
          import sys
          manifest_path, test_path = sys.argv[1:]
          data = json.load(open(manifest_path, encoding="utf-8"))
          data["obligations"][0]["coverage"]["path"] = "src/ERC20Lite.t.sol:ERC20LiteTest.testFuzzTransferPreservesTotalSupply"
          json.dump(data, open(manifest_path, "w", encoding="utf-8"), indent=2)
          open(test_path, "w", encoding="utf-8").write("contract ERC20LiteTest { function testFuzzTransferPreservesTotalSupply() public {} }\n")
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case example-shaped-mirror)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" "$project/test/verity/ERC20Lite.t.sol" <<'PY'
          import json
          import sys
          manifest_path, test_path = sys.argv[1:]
          data = json.load(open(manifest_path, encoding="utf-8"))
          data["obligations"][0]["coverage"] = {
              "disposition": "mirror",
              "path": "test/verity/ERC20Lite.t.sol:ERC20LiteTest.testTransferExample",
              "reason": None,
          }
          json.dump(data, open(manifest_path, "w", encoding="utf-8"), indent=2)
          text = open(test_path, encoding="utf-8").read()
          text = text.rstrip().removesuffix("}") + "\n    function testTransferExample() public {}\n}\n"
          open(test_path, "w", encoding="utf-8").write(text)
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case empty-proof-only-reason)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["coverage"] = {"disposition": "proof_only", "path": None, "reason": ""}
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case hand-edited-bridge)"
          printf '%s\n' "// user edit" > "$project/src/generated/verity/ERC20LiteIface.sol"
          expect_audit_failure "$project" structure

          project="$(copy_case unresolved-decl)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["lean_decl"] = "proof.Missing.nope"
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" trust-boundary

          project="$(copy_case inserted-sorry)"
          python3 - "$project/artifacts/trust-probe/axioms.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["axioms"].append("sorryAx")
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" trust-boundary

          project="$(copy_case inserted-custom-axiom)"
          python3 - "$project/artifacts/trust-probe/axioms.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["axioms"].append("Tama.UnsafeAxiom")
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" trust-boundary

  installer:
    name: Installer safety
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install installer test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck installer/install.sh
      - run: sh -n installer/install.sh
      - run: cargo test -p tamaup-cli
      - name: Shell installer rejects unsupported platform
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  -s) printf "%s\n" FreeBSD ;;' \
            '  -m) printf "%s\n" riscv64 ;;' \
            '  *) printf "%s\n" FreeBSD ;;' \
            'esac' > "$tmp/bin/uname"
          chmod +x "$tmp/bin/uname"
          if PATH="$tmp/bin:$PATH" TAMAUP_HOME="$tmp/home" sh installer/install.sh; then
            echo "installer accepted an unsupported platform" >&2
            exit 1
          fi
          test ! -e "$tmp/home"
