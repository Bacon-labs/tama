name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAMA_LAKE_PACKAGE_CACHE: ${{ github.workspace }}/.cache/tama/lake-packages

jobs:
  verify:
    name: Verify release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msrv
            os: ubuntu-22.04
            toolchain: 1.81.0
          - name: stable-linux
            os: ubuntu-22.04
            toolchain: stable
          - name: stable-macos-arm64
            os: macos-14
            toolchain: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  real-e2e:
    name: Release real e2e ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore Lake package cache
        id: tama-lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tama
          key: tama-lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/tama-project/src/lib.rs', 'crates/tama-project/src/templates/starter-lake-manifest.json', 'fixtures/projects/counter/lake-manifest.json', 'fixtures/projects/counter/lean-toolchain') }}
          restore-keys: |
            tama-lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Lake cache diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "cache-hit=${{ steps.tama-lake-cache.outputs.cache-hit }}"
          found=0
          for dir in .cache/tama/lake-packages/*/.lake/build; do
            if [ -d "$dir" ]; then
              found=1
              du -sh "$dir"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No cached Lake package builds found."
          fi
      - uses: ./.github/actions/install-toolchain
      - name: Build Tama
        run: cargo build --workspace --release
      - name: Fresh starter quickstart
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/release:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          tmp="$(mktemp -d)"
          project="$tmp/my-protocol"
          tama init "$project"
          cd "$project"
          tama doctor
          tama check
          tama build --locked
          tama test
          tama audit
          for field in manifest selectors abi storage-layout yul bytecode runtime-bytecode specs obligations mirrors trust; do
            tama inspect ERC20Lite "$field" >/dev/null
            tama --json inspect ERC20Lite "$field" | python3 -m json.tool >/dev/null
          done
          printf '%s\n' '# stale lock probe' >> tama.toml
          if tama build --locked; then
            echo "expected tama build --locked to fail after stale tama.toml" >&2
            exit 1
          fi
          tama new TipJar
          tama check
          printf '%s\n' '#check this_is_not_in_scope_for_tama_check' >> verity/proof/TipJarProof.lean
          tama check
          printf '%s\n' '#check this_breaks_tama_check' >> verity/spec/TipJarSpec.lean
          if tama check; then
            echo "expected tama check to fail after breaking a spec module" >&2
            exit 1
          fi
      - name: Counter fixture e2e
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/release:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          counter="$PWD/fixtures/projects/counter"
          git -C "$counter" init
          tama --root "$counter" update --no-forge
          tama --root "$counter" doctor --fix
          tama --root "$counter" doctor
          tama --root "$counter" check
          tama --root "$counter" --locked build
          tama --root "$counter" test
          tama --root "$counter" audit
          for field in manifest selectors abi storage-layout yul bytecode runtime-bytecode specs obligations mirrors trust; do
            tama --root "$counter" inspect Counter "$field" >/dev/null
            tama --root "$counter" --json inspect Counter "$field" | python3 -m json.tool >/dev/null
          done

  negative-audit:
    name: Release negative audit
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore Lake package cache
        id: tama-lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tama
          key: tama-lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/tama-project/src/lib.rs', 'crates/tama-project/src/templates/starter-lake-manifest.json', 'fixtures/projects/counter/lake-manifest.json', 'fixtures/projects/counter/lean-toolchain') }}
          restore-keys: |
            tama-lake-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Lake cache diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "cache-hit=${{ steps.tama-lake-cache.outputs.cache-hit }}"
          found=0
          for dir in .cache/tama/lake-packages/*/.lake/build; do
            if [ -d "$dir" ]; then
              found=1
              du -sh "$dir"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No cached Lake package builds found."
          fi
      - uses: ./.github/actions/install-toolchain
      - name: Build baseline
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/release:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          cargo build --workspace --release
          tmp="$(mktemp -d)"
          echo "TAMA_RELEASE_NEGATIVE_TMP=$tmp" >> "$GITHUB_ENV"
          tama init "$tmp/base"
          tama --root "$tmp/base" build
          tama --root "$tmp/base" audit
      - name: Mutated audits fail closed
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/release:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          base="$TAMA_RELEASE_NEGATIVE_TMP/base"

          expect_audit_failure() {
            project="$1"
            check="$2"
            if tama --root "$project" audit "$check"; then
              echo "expected tama audit $check to fail for $project" >&2
              exit 1
            fi
          }

          copy_case() {
            name="$1"
            target="$TAMA_RELEASE_NEGATIVE_TMP/$name"
            cp -R "$base" "$target"
            printf '%s\n' "$target"
          }

          project="$(copy_case deleted-source)"
          rm "$project/verity/src/ERC20Lite.lean"
          expect_audit_failure "$project" structure

          project="$(copy_case corrupted-selector)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["abi"]["functions"][0]["selector"] = "0x00000000"
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" selectors

          project="$(copy_case yul-dispatch-drift)"
          python3 - "$project/artifacts/yul/ERC20Lite.yul" <<'PY'
          import re
          import sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text, count = re.subn(r"case 0x[0-9a-fA-F]{8}", "case 0xffffffff", text, count=1)
          if count != 1:
              raise SystemExit("fixture needs a Yul selector case")
          open(path, "w", encoding="utf-8").write(text)
          PY
          expect_audit_failure "$project" selectors

          project="$(copy_case corrupted-event-topic)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["abi"].setdefault("events", []).append({
              "name": "SyntheticEvent",
              "signature": "SyntheticEvent(address)",
              "topic0": "0x00",
              "fields": [{"name": "account", "type": "address", "indexed": False}],
          })
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" selectors

          project="$(copy_case duplicate-storage)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["storage"][1]["slot"] = data["storage"][0]["slot"]
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" storage-layout

          project="$(copy_case layout-report-drift)"
          python3 - "$project/artifacts/layout-report.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["contracts"][0]["fields"][0]["canonicalSlot"] += 1
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" storage-layout

          project="$(copy_case missing-mirror)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["mirrors"] = []
          data["obligations"][0]["proof_only_reason"] = None
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case mirror-outside-foundry-test)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" "$project/src/ERC20Lite.t.sol" <<'PY'
          import json
          import sys
          manifest_path, test_path = sys.argv[1:]
          data = json.load(open(manifest_path, encoding="utf-8"))
          data["obligations"][0]["mirrors"] = [
              "src/ERC20Lite.t.sol:ERC20LiteTest.testFuzzTransferPreservesTotalSupply"
          ]
          json.dump(data, open(manifest_path, "w", encoding="utf-8"), indent=2)
          open(test_path, "w", encoding="utf-8").write("contract ERC20LiteTest { function testFuzzTransferPreservesTotalSupply() public {} }\n")
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case example-shaped-mirror)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" "$project/test/verity/ERC20Lite.t.sol" <<'PY'
          import json
          import sys
          manifest_path, test_path = sys.argv[1:]
          data = json.load(open(manifest_path, encoding="utf-8"))
          data["obligations"][0]["mirrors"] = [
              "test/verity/ERC20Lite.t.sol:ERC20LiteTest.testTransferExample"
          ]
          json.dump(data, open(manifest_path, "w", encoding="utf-8"), indent=2)
          text = open(test_path, encoding="utf-8").read()
          text = text.rstrip().removesuffix("}") + "\n    function testTransferExample() public {}\n}\n"
          open(test_path, "w", encoding="utf-8").write(text)
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case empty-proof-only-reason)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["mirrors"] = []
          data["obligations"][0]["proof_only_reason"] = ""
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" coverage

          project="$(copy_case hand-edited-bridge)"
          printf '%s\n' "// user edit" > "$project/src/generated/verity/ERC20LiteIface.sol"
          expect_audit_failure "$project" structure

          project="$(copy_case unresolved-decl)"
          python3 - "$project/artifacts/manifest/ERC20Lite.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["dischargers"] = ["proof.Missing.nope"]
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" trust-boundary

          project="$(copy_case inserted-sorry)"
          python3 - "$project/artifacts/trust-probe/axioms.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["dischargers"][0]["axioms"].append("sorryAx")
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" trust-boundary

          project="$(copy_case inserted-custom-axiom)"
          python3 - "$project/artifacts/trust-probe/axioms.json" <<'PY'
          import json
          import sys
          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          data["obligations"][0]["dischargers"][0]["axioms"].append("Tama.UnsafeAxiom")
          json.dump(data, open(path, "w", encoding="utf-8"), indent=2)
          PY
          expect_audit_failure "$project" trust-boundary

  installer:
    name: Release installer safety
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install installer test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck installer/install.sh
      - run: sh -n installer/install.sh
      - run: cargo test -p tamaup-cli
      - name: Shell installer rejects unsupported platform
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  -s) printf "%s\n" FreeBSD ;;' \
            '  -m) printf "%s\n" riscv64 ;;' \
            '  *) printf "%s\n" FreeBSD ;;' \
            'esac' > "$tmp/bin/uname"
          chmod +x "$tmp/bin/uname"
          if PATH="$tmp/bin:$PATH" TAMAUP_HOME="$tmp/home" sh installer/install.sh; then
            echo "installer accepted an unsupported platform" >&2
            exit 1
          fi
          test ! -e "$tmp/home"

  build-artifacts:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs:
      - verify
      - real-e2e
      - negative-audit
      - installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-aarch64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: Pack archive
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="tama-$version-${{ matrix.platform }}"
          mkdir -p "$staging/bin"
          cp target/release/tama "$staging/bin/tama"
          cp target/release/tamaup "$staging/bin/tamaup"
          tar -C "$staging" -czf "$staging.tar.gz" bin/tama bin/tamaup
      - uses: actions/upload-artifact@v4
        with:
          name: tama-${{ matrix.platform }}
          path: tama-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish signed release
    runs-on: ubuntu-22.04
    needs: build-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tama-*
          merge-multiple: true
      - name: Build manifest
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          previous_manifest=""
          if curl -fsSL https://github.com/bacon-labs/tama/releases/latest/download/manifest.json -o dist/previous-manifest.json; then
            previous_manifest="dist/previous-manifest.json"
          fi
          python3 - "$version" "$previous_manifest" dist/*.tar.gz > dist/manifest.json <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          previous_manifest = sys.argv[2]
          artifacts = []
          expected_platforms = {
              "linux-aarch64",
              "linux-x86_64",
              "macos-aarch64",
          }
          for raw in sys.argv[3:]:
              path = pathlib.Path(raw)
              name = path.name
              suffix = ".tar.gz"
              prefix = f"tama-{version}-"
              if not name.startswith(prefix) or not name.endswith(suffix):
                  raise SystemExit(f"unexpected release archive name: {name}")
              platform = name[len(prefix):-len(suffix)]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({
                  "platform": platform,
                  "url": f"https://github.com/bacon-labs/tama/releases/download/v{version}/{name}",
                  "sha256": digest,
              })
          platforms = [artifact["platform"] for artifact in artifacts]
          if len(platforms) != len(set(platforms)):
              raise SystemExit("duplicate platform archive in release artifacts")
          if set(platforms) != expected_platforms:
              expected = ", ".join(sorted(expected_platforms))
              found = ", ".join(sorted(platforms)) or "<none>"
              raise SystemExit(f"release artifacts must cover [{expected}], found [{found}]")
          current = {
              "version": version,
              "artifacts": sorted(artifacts, key=lambda item: item["platform"]),
          }

          SAFE_VERSION = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._+-]*[A-Za-z0-9])?$")
          SAFE_SHA256 = re.compile(r"^[0-9a-f]{64}$")
          SAFE_PLATFORM = re.compile(r"^[A-Za-z0-9._+-]+$")
          HTTPS_URL = re.compile(r"^https://[A-Za-z0-9]")

          def require_string(value, label):
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"invalid release manifest field: {label}")
              if any(ord(ch) < 32 or ord(ch) == 127 for ch in value):
                  raise SystemExit(f"unsafe control character in release manifest field: {label}")
              return value

          def reject_unknown_keys(obj, allowed, label):
              if not isinstance(obj, dict):
                  raise SystemExit(f"invalid release manifest field: {label}")
              unknown = sorted(set(obj) - set(allowed))
              if unknown:
                  raise SystemExit(f"unknown release manifest field in {label}: {unknown[0]}")

          def validate_release(release):
              reject_unknown_keys(release, {"version", "artifacts"}, "release")
              release_version = require_string(release.get("version"), "release.version")
              if not SAFE_VERSION.fullmatch(release_version) or ".." in release_version:
                  raise SystemExit(f"unsafe release version: {release_version}")
              artifacts = release.get("artifacts")
              if not isinstance(artifacts, list) or not artifacts:
                  raise SystemExit(f"release {release_version} is missing artifacts")
              platforms = set()
              for artifact in artifacts:
                  reject_unknown_keys(artifact, {"platform", "url", "sha256"}, "artifact")
                  platform = require_string(artifact.get("platform"), "artifact.platform")
                  if not SAFE_PLATFORM.fullmatch(platform):
                      raise SystemExit(f"unsafe artifact platform: {platform}")
                  if platform in platforms:
                      raise SystemExit(f"duplicate artifact platform in release manifest: {release_version} {platform}")
                  platforms.add(platform)
                  url = require_string(artifact.get("url"), "artifact.url")
                  if not HTTPS_URL.match(url):
                      raise SystemExit(f"release artifact URL must use https:// with a host for {release_version} {platform}")
                  sha256 = require_string(artifact.get("sha256"), "artifact.sha256")
                  if not SAFE_SHA256.fullmatch(sha256):
                      raise SystemExit(f"invalid artifact SHA-256 for {release_version} {platform}")

          def validate_release_set(releases, stable=None, nightly=None):
              versions = set()
              for release in releases:
                  validate_release(release)
                  release_version = release["version"]
                  if release_version in versions:
                      raise SystemExit(f"duplicate release version in release manifest: {release_version}")
                  versions.add(release_version)
              for channel, channel_version in (("stable", stable), ("nightly", nightly)):
                  if channel_version is not None and channel_version not in versions:
                      raise SystemExit(f"release manifest {channel} channel points to missing release: {channel_version}")
              return versions

          def releases_from(manifest):
              reject_unknown_keys(manifest, {"schema", "stable", "nightly", "version", "artifacts", "releases"}, "manifest")
              schema = manifest.get("schema")
              if schema is not None and schema != "tama.release-manifest.v1":
                  raise SystemExit(f"unsupported previous release manifest schema: {schema}")
              is_cumulative = schema is not None or "stable" in manifest or "nightly" in manifest or "releases" in manifest
              if is_cumulative:
                  if schema != "tama.release-manifest.v1":
                      raise SystemExit("cumulative previous release manifest must declare schema tama.release-manifest.v1")
                  stable = require_string(manifest.get("stable"), "stable")
                  if not SAFE_VERSION.fullmatch(stable) or ".." in stable:
                      raise SystemExit(f"unsafe stable release version: {stable}")
                  if "nightly" in manifest:
                      nightly = require_string(manifest.get("nightly"), "nightly")
                      if not SAFE_VERSION.fullmatch(nightly) or ".." in nightly:
                          raise SystemExit(f"unsafe nightly release version: {nightly}")
                  if "version" in manifest or "artifacts" in manifest:
                      raise SystemExit("cumulative previous release manifest must not mix legacy version/artifacts fields")
                  if not isinstance(manifest.get("releases"), list) or not manifest["releases"]:
                      raise SystemExit("cumulative previous release manifest must contain releases[]")
                  releases = list(manifest["releases"])
                  validate_release_set(releases, stable, manifest.get("nightly"))
                  return releases, manifest.get("nightly")
              if "version" in manifest and "artifacts" in manifest:
                  release = {"version": manifest["version"], "artifacts": manifest["artifacts"]}
                  validate_release(release)
                  return [release], None
              return [], None

          if previous_manifest:
              previous = json.loads(pathlib.Path(previous_manifest).read_text(encoding="utf-8"))
              releases, nightly = releases_from(previous)
          else:
              releases = []
              nightly = None
          validate_release(current)
          releases = [release for release in releases if release.get("version") != version]
          releases.append(current)
          releases.sort(key=lambda release: release["version"])
          validate_release_set(releases, version, nightly)
          manifest = {
              "schema": "tama.release-manifest.v1",
              "stable": version,
              "releases": releases,
          }
          if nightly is not None:
              manifest["nightly"] = nightly
          print(json.dumps(manifest, indent=2))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/manifest.json
