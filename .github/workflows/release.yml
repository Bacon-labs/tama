name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  pages: write

env:
  CARGO_TERM_COLOR: always
  TAMA_LAKE_PACKAGE_CACHE: ${{ github.workspace }}/.cache/tama/lake-packages

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  real-e2e:
    name: Release real e2e ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .cache/tama
          key: tama-lake-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/lake-manifest.json') }}
          restore-keys: |
            tama-lake-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Lean, Foundry, and solc
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          curl -fsSL https://foundry.paradigm.xyz | bash
          foundryup
          python3 -m pip install --user --upgrade solc-select
          solc-select install 0.8.33
          solc-select use 0.8.33
          forge --version
          solc --version
      - name: Build Tama
        run: cargo build --workspace
      - name: Fresh starter quickstart
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/debug:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          tmp="$(mktemp -d)"
          project="$tmp/my-protocol"
          tama init "$project"
          cd "$project"
          tama doctor
          tama check
          tama build --locked
          tama test
          tama audit
          for field in manifest selectors abi storage-layout yul bytecode runtime-bytecode theorems obligations mirrors trust; do
            tama inspect ERC20Lite "$field" >/dev/null
            tama --json inspect ERC20Lite "$field" | python3 -m json.tool >/dev/null
          done
          tama new TipJar
          tama check
          printf '%s\n' '#check this_is_not_in_scope_for_tama_check' >> verity/proof/TipJarProof.lean
          tama check
          printf '%s\n' '#check this_breaks_tama_check' >> verity/spec/TipJarSpec.lean
          if tama check; then
            echo "expected tama check to fail after breaking a spec module" >&2
            exit 1
          fi
      - name: Counter fixture e2e
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$PWD/target/debug:$HOME/.elan/bin:$HOME/.foundry/bin:$HOME/.local/bin:$PATH"
          counter="$PWD/fixtures/projects/counter"
          git -C "$counter" init
          (cd "$counter" && lake update)
          (cd "$counter" && forge install foundry-rs/forge-std@v1.16.1 --shallow)
          tama --root "$counter" doctor --fix
          tama --root "$counter" doctor
          tama --root "$counter" check
          tama --root "$counter" --locked build
          tama --root "$counter" test
          tama --root "$counter" audit
          for field in manifest selectors abi storage-layout yul bytecode runtime-bytecode theorems obligations mirrors trust; do
            tama --root "$counter" inspect Counter "$field" >/dev/null
            tama --root "$counter" --json inspect Counter "$field" | python3 -m json.tool >/dev/null
          done

  build-artifacts:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs:
      - verify
      - real-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-x86_64
            os: macos-13
          - platform: macos-aarch64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - name: Pack archive
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="tama-$version-${{ matrix.platform }}"
          mkdir -p "$staging/bin"
          cp target/release/tama "$staging/bin/tama"
          cp target/release/tamaup "$staging/bin/tamaup"
          tar -C "$staging" -czf "$staging.tar.gz" bin/tama bin/tamaup
      - uses: actions/upload-artifact@v4
        with:
          name: tama-${{ matrix.platform }}
          path: tama-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish signed release
    runs-on: ubuntu-22.04
    needs: build-artifacts
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tama-*
          merge-multiple: true
      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Build manifest
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" dist/*.tar.gz > dist/manifest.json <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          artifacts = []
          for raw in sys.argv[2:]:
              path = pathlib.Path(raw)
              name = path.name
              suffix = ".tar.gz"
              prefix = f"tama-{version}-"
              if not name.startswith(prefix) or not name.endswith(suffix):
                  raise SystemExit(f"unexpected release archive name: {name}")
              platform = name[len(prefix):-len(suffix)]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({
                  "platform": platform,
                  "url": f"https://tama.tools/releases/{name}",
                  "sha256": digest,
              })
          current = {
              "version": version,
              "artifacts": sorted(artifacts, key=lambda item: item["platform"]),
          }

          def releases_from(manifest):
              if "releases" in manifest:
                  return list(manifest["releases"])
              if "version" in manifest and "artifacts" in manifest:
                  return [{"version": manifest["version"], "artifacts": manifest["artifacts"]}]
              return []

          try:
              with urllib.request.urlopen("https://tama.tools/manifest.json", timeout=10) as response:
                  previous = json.load(response)
              releases = releases_from(previous)
          except (OSError, urllib.error.URLError, json.JSONDecodeError):
              releases = []
          releases = [release for release in releases if release.get("version") != version]
          releases.append(current)
          releases.sort(key=lambda release: release["version"])
          print(json.dumps({
              "schema": "tama.release-manifest.v1",
              "stable": version,
              "releases": releases,
          }, indent=2))
          PY
      - name: Sign manifest
        env:
          TAMA_MINISIGN_SECRET_KEY: ${{ secrets.TAMA_MINISIGN_SECRET_KEY }}
          TAMA_MINISIGN_PUBLIC_KEY: ${{ secrets.TAMA_MINISIGN_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$TAMA_MINISIGN_SECRET_KEY"
          test -n "$TAMA_MINISIGN_PUBLIC_KEY"
          printf '%s\n' "$TAMA_MINISIGN_SECRET_KEY" > dist/minisign.sec
          minisign -S -s dist/minisign.sec -m dist/manifest.json -x dist/manifest.json.minisig -W
          minisign -V -P "$TAMA_MINISIGN_PUBLIC_KEY" -m dist/manifest.json -x dist/manifest.json.minisig
          rm dist/minisign.sec
      - name: Prepare Pages bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public/releases
          cp -R site/. public/
          cp installer/install.sh public/install.sh
          cp dist/manifest.json public/manifest.json
          cp dist/manifest.json.minisig public/manifest.json.minisig
          cp dist/*.tar.gz public/releases/
      - name: Check Pages links
        shell: bash
        run: |
          set -euxo pipefail
          python3 - public/index.html public <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          index = Path(sys.argv[1])
          root = Path(sys.argv[2])

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  for key in ("href", "src"):
                      value = attrs.get(key)
                      if value:
                          self.links.append(value)

          parser = LinkParser()
          parser.feed(index.read_text(encoding="utf-8"))
          for link in parser.links:
              if link.startswith(("http://", "https://", "mailto:")):
                  continue
              if link.startswith("#"):
                  target = link[1:]
                  if target not in parser.ids:
                      raise SystemExit(f"missing anchor target: {link}")
                  continue
              target = root / link.lstrip("/")
              if not target.exists():
                  raise SystemExit(f"missing linked asset: {link}")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/manifest.json
            dist/manifest.json.minisig
