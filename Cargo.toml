[workspace]
members = [
  "crates/tama-cli",
  "crates/tamaup-cli",
  "crates/tama-config",
  "crates/tama-project",
  "crates/tama-build",
  "crates/tama-manifest",
  "crates/tama-audit",
  "crates/tama-inspect",
  "crates/tama-toolchain",
  "crates/tama-common",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
authors = ["Zefram (Foglight)"]
repository = "https://github.com/foglight-labs/tama"

[workspace.dependencies]
assert_cmd = "2.0"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
hex = "0.4"
insta = { version = "1.41", features = ["json"] }
miette = { version = "7.2", features = ["fancy"] }
minisign-verify = "0.2.5"
regex = "1.11"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.13"
thiserror = "1.0"
tabled = "0.16"
tiny-keccak = { version = "2.0", features = ["keccak"] }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.10", features = ["json"] }
which = "6.0"
xshell = "0.2"
