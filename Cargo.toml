[workspace]
members = [
  "crates/tama-cli",
  "crates/tamaup-cli",
  "crates/tama-config",
  "crates/tama-project",
  "crates/tama-build",
  "crates/tama-manifest",
  "crates/tama-audit",
  "crates/tama-inspect",
  "crates/tama-toolchain",
  "crates/tama-common",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.2"
rust-version = "1.81"
license = "MIT"
authors = ["zefram.eth"]
repository = "https://github.com/bacon-labs/tama"

[workspace.dependencies]
anstream = "0.6"
anstyle = "1.0"
camino = { version = "1.1", features = ["serde1"] }
# Keep below 4.6 while MSRV is Rust 1.81; clap 4.6 uses Edition 2024.
clap = { version = "=4.5.51", features = ["derive"] }
flate2 = "1.0"
hex = "0.4"
regex = "1.11"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.13"
thiserror = "1.0"
tabled = "0.16"
tiny-keccak = { version = "2.0", features = ["keccak"] }
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.10", features = ["json"] }
which = "6.0"
